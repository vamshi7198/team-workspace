# Local development database only. Bound to localhost so it is never reachable from the network.
# Usage: docker compose -f docker-compose.dev.yml up -d
name: team-workspace-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace_dev_only
      POSTGRES_DB: workspace
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
